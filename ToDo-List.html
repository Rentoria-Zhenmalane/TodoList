<!DOCTYPE html>
<html>

<head>
  <title>To Do List</title>
  <link rel="stylesheet" href="ToDo.css">
</head>

<body>
  <p> To Do List</p>

  <div class="todo-input-grid">
    <input placeholder="To Do Name" class="js-name-input name-input">
    <input class="js-date-input date-input" type="date">

    <button class="add-button js-add-button"> Add</button>

    </div>

  </div>




  <script src="toDo-list.js">

  </script>

</body>

</html>
